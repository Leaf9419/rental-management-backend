spring.application.name=Rental Management System

# database configuration
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver
spring.datasource.url=jdbc:sqlserver://127.0.0.1:1433;database=rental_management;encrtpt=true;trustServerCertificate=true;
spring.datasource.username=sa
spring.datasource.password=1234

# JPA configuration
spring.jpa.database-platform=org.hibernate.dialect.SQLServerDialect
spring.jpa.show-sql=true
spring.jpa.hibernate.ddl-auto=none
spring.jpa.hibernate.naming.implicit-strategy=org.hibernate.boot.model.naming.ImplicitNamingStrategyLegacyJpaImpl
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl

# JWT configuration
jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION}

# Email configuration
spring.mail.host=${MAIL_HOST}
spring.mail.port=${MAIL_PORT}
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true

# Email sender
app.mail.from=${MAIL_FROM}
app.mail.from-name=${MAIL_FROM_NAME}

# verification code settings
app.verification.code-length=6
app.verification.code-expiration=300

# Google OAuth2 client configuration
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET}
spring.security.oauth2.client.registration.google.scope=profile,email
spring.security.oauth2.client.registration.google.redirect-uri=http://localhost:8080/auth/oauth2/callback/google
spring.security.oauth2.client.registration.google.client-name=Google

# Google OAuth2 provider configuration
spring.security.oauth2.client.provider.google.authorization-uri=https://accounts.google.com/o/oauth2/v2/auth
spring.security.oauth2.client.provider.google.token-uri=https://oauth2.googleapis.com/token
spring.security.oauth2.client.provider.google.user-info-uri=https://www.googleapis.com/oauth2/v3/userinfo
spring.security.oauth2.client.provider.google.user-name-attribute=sub

# LINE OAuth2 configuration
spring.security.oauth2.client.registration.line.client-id=${LINE_CHANNEL_ID}
spring.security.oauth2.client.registration.line.client-secret=${LINE_CHANNEL_SECRET}
spring.security.oauth2.client.registration.line.scope=profile,openid,email
spring.security.oauth2.client.registration.line.redirect-uri=http://localhost:8080/auth/oauth2/callback/line
spring.security.oauth2.client.registration.line.client-name=LINE
spring.security.oauth2.client.registration.line.authorization-grant-type=authorization_code
spring.security.oauth2.client.registration.line.client-authentication-method=client_secret_post

# LINE OAuth2 provider configuration
spring.security.oauth2.client.provider.line.authorization-uri=https://access.line.me/oauth2/v2.1/authorize
spring.security.oauth2.client.provider.line.token-uri=https://api.line.me/oauth2/v2.1/token
# spring.security.oauth2.client.provider.line.jwk-set-uri=https://api.line.me/oauth2/v2.1/certs
# spring.security.oauth2.client.provider.line.issuer-uri=https://access.line.me
spring.security.oauth2.client.provider.line.user-info-uri=https://api.line.me/v2/profile
# spring.security.oauth2.client.provider.line.user-name-attribute=sub
spring.security.oauth2.client.provider.line.user-name-attribute=userId

# frontend URL(for redirect after OAuth)
app.frontend.url=http://localhost:5173
# app.oauth2.authorized-redirect-uris=http://localhost:5173/oauth2/redirect